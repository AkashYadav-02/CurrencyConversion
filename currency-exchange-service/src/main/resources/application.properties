# Application Name
spring.application.name=currency-exchange

# Server Port Configuration
server.port=8000

# Config Server (If you're using Spring Cloud Config Server)
spring.config.import=optional:configserver:http://acer1157.mshome.net:8888

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.enabled=true
# H2 Database Configuration (If you're using H2 for testing)
spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Enable H2 Console for easy debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Defer datasource initialization until after the schema is generated
spring.jpa.defer-datasource-initialization=true


#resilience4j.retry.instances.sample-api.max-attempts=5
#resilience4j.retry.instances.sample-api.wait-duration=2s
#resilience4j.retry.instances.sample-api.enable-exponential-backoff=true
resilience4j.circuitbreaker.instances.default.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.default.sliding-window-size=5
resilience4j.circuitbreaker.instances.default.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.default.wait-duration-in-open-state=5000
resilience4j.ratelimiter.instances.default.limit-for-period=2
resilience4j.ratelimiter.instances.default.limit-refresh-period=10

resilience4j.bulkhead.instances.default.max-concurrent-calls=10