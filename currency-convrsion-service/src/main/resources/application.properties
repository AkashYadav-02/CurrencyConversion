# Application Name
spring.application.name=currency-conversion

# Server Port Configuration
server.port=8100

# Config Server (If you're using Spring Cloud Config Server)
spring.config.import=optional:configserver:http://acer1157.mshome.net:8888

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Disable Self-Preservation in Eureka Server (for development)
eureka.server.enable-self-preservation=false

# H2 Database Configuration (If you're using H2 for testing)
spring.jpa.show-sql=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Enable H2 Console for easy debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Defer datasource initialization until after the schema is generated
spring.jpa.defer-datasource-initialization=true
